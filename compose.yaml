name: victoriametrics

x-daemonless:
  title: "VictoriaMetrics"
  icon: ":material-chart-timeline-variant:"
  category: "Monitoring"
  description: "VictoriaMetrics is a fast, cost-effective, and scalable time-series database and monitoring solution. It is a drop-in replacement for Prometheus storage with low memory usage."
  upstream_url: "https://github.com/VictoriaMetrics/VictoriaMetrics"
  web_url: "https://victoriametrics.com/"
  freshports_url: "https://www.freshports.org/net-mgmt/victoria-metrics/"
  user: "bsd"
  mlock: false
  community: "Slack:https://victoriametrics.slack.com/"
  appjail: true

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      RETENTION_PERIOD: "How long to keep metrics (e.g. 30d, 6m, 1y)"
      VM_EXTRA_ARGS: "Extra command line flags passed to victoria-metrics"
    volumes:
      /config: "Time-series data (data/) and optional scrape config (prometheus.yml)"
    ports:
      8428: "Web UI (vmui), PromQL API and metrics ingestion"

services:
  victoriametrics:
    image: ghcr.io/daemonless/victoriametrics:latest
    container_name: victoriametrics
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - RETENTION_PERIOD=1y

    volumes:
      - /path/to/containers/victoriametrics:/config

    ports:
      - 8428:8428
